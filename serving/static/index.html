<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HazeCast SG — Hourly Forecast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;600;700;800;900&display=swap">
<style>
:root{
  --bg:#17140F;
  --card:#332B21;
  --card-hi:#3E3425;
  --ink:#F3EADD;
  --ink-muted:#CBBBA3;
  --ink-faint:#8C7E66;
  --good:#4ECB82; --good-bg:rgba(78,203,130,0.16);
  --amber:#FFA552; --amber-bg:rgba(255,165,82,0.16);
  --high:#FF6B52; --high-bg:rgba(255,107,82,0.16);
  --accent:#FF9D63;
  --line:#5B4E39;
  --land:#2C3A2E; --land-line:#8FB89C;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);padding:14px 20px 10px;display:flex;flex-direction:column;overflow:hidden;font-variant-numeric:tabular-nums;}
.display{font-family:'Fredoka',sans-serif; font-weight:700;}
.wrap{max-width:1600px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;min-height:0;}

.top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:14px;flex-shrink:0;}
.brand h1{font-size:20px;margin:0;font-weight:900;letter-spacing:-0.01em;}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

.health-pill{font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink-muted);}
.health-pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;}
.health-pill.ok{background:var(--good-bg);color:var(--good);border-color:transparent;}
.health-pill.bad{background:var(--high-bg);color:var(--high);border-color:transparent;}
#refreshBtn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:700;cursor:pointer;transition:background 0.15s ease;}
#refreshBtn:hover{background:var(--card-hi);}
#refreshBtn:disabled{opacity:0.6;cursor:default;}

/* Sits directly above the map, same max-width as .bar-section below it, so the
   map reads as framed between a "national" line on top and the selected-region
   line + gradient bar underneath -- same left-aligned label+value layout as
   .bar-label, so the two rows visually line up. */
.national-section{max-width:600px;margin:0 auto 8px;width:100%;flex-shrink:0;
  display:flex;align-items:baseline;gap:8px;}
.national-section .nat-label{font-size:11px;font-weight:800;color:var(--ink-muted);
  text-transform:uppercase;letter-spacing:0.05em;}
.national-section .nat-val{font-size:17px;font-weight:700;}

.scene{position:relative; width:1200px; height:500px; margin:10px auto 0;}
.scene svg.map{position:absolute; left:0; top:0;}
.scene svg{fill:none;}
.scene path[data-region]{fill:none;}

.callout{position:absolute; transform:translateX(-50%); width:144px; background:var(--card);
  border-radius:13px; padding:8px 10px 9px; text-align:center; cursor:pointer;
  border:1px solid var(--line); transition:transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 10px 22px rgba(0,0,0,0.45);}
.callout:hover{transform:translateX(-50%) translateY(-2px); border-color:var(--ink-faint);}
.callout.sel{border-color:var(--accent); border-width:2px; padding:7px 9px 8px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.07), 0 10px 24px rgba(0,0,0,0.5), 0 0 0 3px rgba(255,157,99,0.18);}
.callout.sel:hover{transform:translateX(-50%);}
.c-head{display:flex; align-items:center; gap:7px; text-align:left;}
.fig-badge{width:32px; height:32px; flex:none; border-radius:50%; background:var(--card-hi);
  border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden;}
.fig-sm{width:24px; height:24px; flex:none; object-fit:contain; display:block;}
.c-name{font-size:8.5px; font-weight:800; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.03em;}
.c-num-row{display:flex; align-items:baseline; gap:2px;}
.c-num{font-size:19px; line-height:1;}
.c-unit{font-size:7.5px; color:var(--ink-muted); font-weight:700;}
.c-band{font-size:9px; font-weight:800; margin-top:4px; text-align:left;}
.c-mini-row{display:flex; gap:5px; margin-top:6px; padding-top:5px; border-top:1px dashed var(--line);}
.c-mini{flex:1; text-align:center; border-radius:6px; padding:2px 0;}
.c-mini .lbl{font-size:7px; font-weight:800; color:var(--ink-muted); text-transform:uppercase;}
.c-mini .val{font-size:11px; font-weight:800; margin-top:1px;}

@media (max-height:480px){
  body{padding:8px 14px 6px;}
  .top{margin-bottom:6px; gap:8px;}
  .brand h1{font-size:16px;}
  .health-pill,#refreshBtn{padding:5px 10px; font-size:10.5px;}
  .national-section{margin-bottom:5px;}
  .national-section .nat-val{font-size:14px;}
  .bar-section{margin-top:4px;}
}

.app{position:absolute; top:0; left:0; width:1200px; transform-origin:top left;}
.scene-wrap{flex:1 1 auto; min-height:0; width:100%; position:relative; overflow:hidden;}
.map-msg{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); max-width:320px; text-align:center;
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 20px; font-size:13px; font-weight:600; color:var(--ink-muted);}

.bar-section{max-width:600px; margin:6px auto 0; flex-shrink:0; width:100%;}
.bar-label{display:flex; align-items:baseline; gap:8px; margin-bottom:8px; font-size:15px; font-weight:700;}
.bar-label .region-name{text-transform:capitalize;}
.bar-label .region-val{font-size:15px;}
.band-bar{position:relative; height:10px; border-radius:999px; overflow:visible;
  background:linear-gradient(to right,
    var(--good) 0%, var(--good) 22%,
    var(--amber) 22%, var(--amber) 60%,
    var(--high) 60%, var(--high) 100%);}
.band-bar-marker{position:absolute; top:50%; width:14px; height:14px; border-radius:50%;
  background:#fff; border:3px solid var(--ink); transform:translate(-50%,-50%); box-shadow:0 1px 4px rgba(53,43,34,0.35);}
.band-bar-scale{position:relative; height:13px; font-size:9.5px; font-weight:700; color:var(--ink-faint); margin-top:5px;}
.band-bar-scale span{position:absolute; transform:translateX(-50%);}
.band-bar-scale span:first-child{transform:translateX(0);}
.band-bar-scale span:last-child{transform:translateX(-100%);}

/* Band names, positioned to literally sit under their own colour zone of the
   gradient above (same 0/22/60/100% boundaries as .band-bar's stops) instead
   of a separate centred legend row that didn't line up with the bar's colours. */
.band-legend{position:relative; height:13px; font-size:10px; font-weight:800; margin-top:5px;
  text-transform:uppercase; letter-spacing:0.03em;}
.band-legend span{position:absolute; top:0; text-align:center;}

/* Bottom-left Live/Mockup switch. Laid out as a normal flex row at the bottom
   of .wrap (not position:fixed) so it reserves its own space in the column
   layout, same as .top/.bar-section -- that's what keeps it from ever
   floating over the map or the bar text on a short/landscape-phone viewport;
   .scene-wrap (flex:1) simply gets a little less room to work with. */
.bottom-bar{flex-shrink:0; display:flex; align-items:center; gap:10px; margin-top:6px; min-height:24px;}
.mode-toggle{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
  border-radius:999px; padding:4px; flex:none;}
.mode-toggle button{border:none; background:transparent; color:var(--ink-muted);
  font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em;
  padding:5px 11px; border-radius:999px; cursor:pointer; transition:background 0.12s ease, color 0.12s ease;}
.mode-toggle button.active{background:var(--card-hi); color:var(--ink);}
.mode-toggle button.active.is-live{color:var(--good);}
.mode-toggle button.active.is-mock{color:var(--amber);}
.mode-note{font-size:10.5px; font-weight:600; color:var(--ink-faint); line-height:1.3; display:none;}
.mode-note.show{display:block;}
@media (max-height:480px){
  .bottom-bar{margin-top:4px; min-height:20px;}
  .mode-toggle{padding:3px;}
  .mode-toggle button{font-size:9px; padding:4px 8px;}
  .mode-note{font-size:9px;}
}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <div class="brand">
    <h1 class="display">HazeCast SG</h1>
  </div>
  <div class="top-right">
    <span id="healthStatus" class="health-pill pending"><span class="dot"></span><span id="healthLabel">Checking&hellip;</span></span>
    <button id="refreshBtn" onclick="loadAll(true)">Refresh</button>
  </div>
</div>

<div class="national-section">
  <span class="nat-label">National</span>
  <span class="nat-val" id="nationalFigure">&mdash;</span>
</div>

<div class="scene-wrap">
<div class="app">

    if (v == null || isNaN(v)) return { key: "good", label: "Normal", note: "go outside" };
    if (v > HIGH_THRESHOLD) return { key: "high", label: "High", note: "stay indoors" };
    if (v >= threshold) return { key: "amber", label: "Elevated", note: "mask up" };
    return { key: "good", label: "Normal", note: "go outside" };
  }

  // Forecasts are stored unrounded (they feed the accuracy metrics); round only for display.
  function fmtPm(v) {
    return (v == null || isNaN(v)) ? "—" : Number(v).toFixed(1);
  }

  function fmtClock(d) {
    return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  function setHealthPill(state) {
    const pill = document.getElementById("healthStatus");
    const label = document.getElementById("healthLabel");
    if (state === "ok") {
      pill.className = "health-pill ok";
      label.textContent = "API healthy";
    } else if (state === "bad") {
      pill.className = "health-pill bad";
      label.textContent = "API unreachable";
    } else {
      pill.className = "health-pill";
      label.textContent = "Mockup data";
    }
  }

  // Fetches JSON, throwing (with the server's own detail message when present,
  // e.g. the /forecast 503 "no forecast available yet" case) on any non-OK
  // response or network failure -- loadLive() below uses that to decide whether
  // to fall back to the embedded mock snapshot.
  async function fetchJSON(path) {
    const res = await fetch(path);
    if (!res.ok) {
      let detail = "HTTP " + res.status;
      try { const body = await res.json(); if (body && body.detail) detail = body.detail; } catch (e) {}
      throw new Error(detail);
    }
    return res.json();
  }

  async function loadLive() {
    const cfg = await fetchJSON("/config");
    if (typeof cfg.elevated_threshold_ug_m3 === "number") threshold = cfg.elevated_threshold_ug_m3;
    forecastData = await fetchJSON("/forecast/hourly");
    // Age of the newest data the forecast was made from (null if not given, e.g. older files).
    const asOf = forecastData.map(r => Date.parse(r.as_of_time)).filter(Number.isFinite);
    forecastAgeHours = asOf.length ? (Date.now() - Math.max(...asOf)) / 3600000 : null;
    // Health is best-effort and doesn't gate live mode -- it just reflects
    // whether the API process itself looks up, separately from forecast data.
    try {
      const res = await fetch("/health");
      setHealthPill(res.ok ? "ok" : "bad");
    } catch (e) {
      setHealthPill("bad");
    }
  }

  function loadMock() {
    threshold = MOCK_CONFIG.elevated_threshold_ug_m3;
    forecastData = MOCK_FORECAST;
    forecastAgeHours = null;
    setHealthPill("mock");
  }

  function updateModeUI() {
    document.getElementById("modeBtnLive").className = "is-live" + (dataMode === MODE_LIVE ? " active" : "");
    document.getElementById("modeBtnMock").className = "is-mock" + (dataMode === MODE_MOCK ? " active" : "");
    const note = document.getElementById("modeNote");
    if (dataMode === MODE_MOCK) {
      note.textContent = mockReason === "fallback"
        ? "Live service unreachable — showing saved demo data instead."
        : "Mockup mode — showing saved demo data, not live.";
      note.classList.add("show");
    } else if (forecastAgeHours != null && forecastAgeHours > STALE_HOURS) {
      note.textContent = "Forecast is from data " + Math.round(forecastAgeHours) +
        " h old — newer data is not available yet, so treat it with caution.";
      note.classList.add("show");
    } else {
      note.classList.remove("show");
    }
  }

  // The one place that decides what ends up on screen: MODE_LIVE tries the real
  // API and, on ANY failure (network error, API down, 503 no-forecast-yet),
  // automatically drops into mock mode with a visible reason -- exactly what
  // lets this file degrade gracefully when the backend isn't reachable (a
  // static host with no API at all) or simply isn't up yet. MODE_MOCK always
  // succeeds, since it only reads the embedded snapshot.
  async function setMode(mode, opts) {
    opts = opts || {};
    if (mode === MODE_MOCK) {
      dataMode = MODE_MOCK;
      mockReason = opts.manual ? "manual" : mockReason;
      loadMock();
      render();
      updateModeUI();
      return;
    }
    dataMode = MODE_LIVE;
    try {
      await loadLive();
      render();
      updateModeUI();
    } catch (e) {
      dataMode = MODE_MOCK;
      mockReason = "fallback";
      loadMock();
      render();
      updateModeUI();
    }
  }

  function mascotFor(b) {
    if (b.key === "high") return MASCOT_HIGH;
    if (b.key === "amber") return MASCOT_AMBER;
    return MASCOT_NORMAL;
  }

  function render() {
    if (!forecastData.length) return;

    // national figure, above the map
    const nat6 = forecastData.find(r => r.region === "national" && r.horizon_hours === activeHorizon);
    if (nat6) {
      const nb = band(nat6.forecast_pm25);
      const natEl = document.getElementById("nationalFigure");
      natEl.textContent = fmtPm(nat6.forecast_pm25) + " µg/m³ · " + nb.label;
      natEl.style.color = "var(--" + nb.key + ")";
    }

    // region callouts
    const callouts = document.getElementById("callouts");
    callouts.innerHTML = "";
    Object.keys(REGION_POS).forEach(region => {
      const pos = REGION_POS[region];
      const rows = forecastData.filter(r => r.region === region);
      const main = rows.find(r => r.horizon_hours === activeHorizon);
      if (!main) return;
      const b = band(main.forecast_pm25);
      const h6 = rows.find(r => r.horizon_hours === 6);
      const h12 = rows.find(r => r.horizon_hours === 12);
      const h24 = rows.find(r => r.horizon_hours === 24);
      // Each mini-cell is tinted to its OWN horizon's band (not a leftover
      // "selected horizon" highlight -- there's no horizon toggle any more),
      // so the row reads as a quick 6/12/24h severity trend at a glance.
      const mini = (row, h) => {
        if (!row) return '<div class="c-mini"><div class="lbl">' + h + 'h</div><div class="val">—</div></div>';
        const mb = band(row.forecast_pm25);
        return '<div class="c-mini" style="background:var(--' + mb.key + '-bg)"><div class="lbl">' + h + 'h</div><div class="val" style="color:var(--' + mb.key + ')">' + fmtPm(row.forecast_pm25) + '</div></div>';
      };
      const div = document.createElement("div");
      div.className = "callout" + (region === selectedRegion ? " sel" : "");
      div.style.left = pos.left + "px";
      div.style.bottom = pos.bottom + "px";
      div.onclick = () => { selectedRegion = region; render(); };
      div.innerHTML = `
        <div class="c-head">
          <span class="fig-badge" style="border-color:var(--${b.key});"><img class="fig-sm" src="${mascotFor(b)}" alt="${region} status mascot"></span>
          <div>
            <div class="c-name">${region}</div>
            <div class="c-num-row"><span class="c-num display" style="color:var(--${b.key});">${fmtPm(main.forecast_pm25)}</span><span class="c-unit">&micro;g/m&sup3;</span></div>
          </div>
        </div>
        <div class="c-band" style="color:var(--${b.key});">${b.label} &middot; ${b.note}</div>
        <div class="c-mini-row">${mini(h6, 6)}${mini(h12, 12)}${mini(h24, 24)}</div>
      `;
      callouts.appendChild(div);
    });

    renderBar();
  }

  function renderBar() {
    const rows = forecastData.filter(r => r.region === selectedRegion);
    const main = rows.find(r => r.horizon_hours === activeHorizon) || rows[0];
    if (!main) return;
    const b = band(main.forecast_pm25);
    document.getElementById("detailRegion").textContent = selectedRegion;
    document.getElementById("detailRegion").style.color = "var(--" + b.key + ")";
    document.getElementById("detailVal").textContent = fmtPm(main.forecast_pm25) + " µg/m³ · " + b.label;
    document.getElementById("detailVal").style.color = "var(--ink-muted)";

    const BAND_SCALE_MAX = 250; // matches the "250+" scale label; values beyond this pin to the right edge
    const pct = Math.max(0, Math.min(100, (main.forecast_pm25 / BAND_SCALE_MAX) * 100));
    const marker = document.getElementById("bandBarMarker");
    marker.style.left = pct + "%";
    marker.style.borderColor = "var(--" + b.key + ")";
  }

  // Freshness isn't shown as a persistent label any more -- it's only ever
  // the Refresh button's tooltip, and only set when the user actually clicks
  // it (manual=true), not on the initial load or the 60s background poll.
  // Refresh re-attempts whichever mode is currently active: in live mode that
  // means trying the API again (and auto-falling-back if it's still down); in
  // mock mode it's a no-op re-render of the same snapshot.
  async function loadAll(manual) {
    const btn = document.getElementById("refreshBtn");
    const prevLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Refreshing…";
    try {
      await setMode(dataMode, {});
    } finally {
      btn.disabled = false;
      btn.textContent = prevLabel;
      if (manual) btn.title = "Last refreshed: " + fmtClock(new Date());
    }
  }

  setMode(MODE_LIVE, {});
  setInterval(() => loadAll(false), 60000);
</script>
</body>
</html>

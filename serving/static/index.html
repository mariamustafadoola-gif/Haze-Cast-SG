  /* Theme matches the team deck: deep indigo night, misty teal haze, pale mint cards
     with a sage edge. Green, yellow and red are reserved for the air bands. */
  :root {
    --night: #1A2160;
    --mist: #0E8DB0;
    --mist-2: #2CC1C9;
    --card: #ECF9F4;
    --card-edge: #5B806F;
    --ink: #14204F;
    --muted: #4C6461;
    --line: #CBE3DA;
    --tint: #D7EEE6;
    --accent: #0F7E93;
    --sea: #DDF0EA;
    --land: #B7CEC6;
    --head: #E6EEF0;
    --red: #C62F2F;
    --yellow: #FFC53D;
    --green: #4CC38A;
    --yellow-soft: #FFF4D6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background-color: var(--night);
    background-image:
      radial-gradient(ellipse 60% 40% at 8% 4%, rgba(44,193,201,0.55), transparent 70%),
      radial-gradient(ellipse 50% 35% at 92% 18%, rgba(14,141,176,0.45), transparent 70%),
      radial-gradient(ellipse 70% 40% at 30% 70%, rgba(14,141,176,0.30), transparent 70%),
      radial-gradient(ellipse 60% 35% at 85% 95%, rgba(44,193,201,0.30), transparent 70%);
    color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

  .layout { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

    .layout { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; }

  .card { background: var(--card); border: 3px solid var(--card-edge); border-radius: 22px; padding: 14px; box-shadow: 0 6px 18px rgba(5,10,40,0.35); }
  .card h2 { margin: 0; font-size: 16px; font-weight: 800; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .sub { color: var(--muted); font-size: 13px; }

  /* Tabs and switches */
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--tint); border-radius: 14px; padding: 4px; }
  .tabs button {
    border: 0; background: transparent; border-radius: 10px; padding: 9px 2px;
    font-weight: 700; font-size: 14px; color: var(--muted);

  .tabs button.on { background: var(--night); color: #fff; box-shadow: 0 1px 3px rgba(5,10,40,0.3); }
  .who { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 12px; text-align: center; }
  .who-label { font-size: 13px; font-weight: 700; color: var(--muted); }

  .loc-btn {
    display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px;

  .region { cursor: pointer; transition: opacity 0.15s; }
  .region:hover { opacity: 0.88; }
  .legend {
    position: absolute; right: 6px; bottom: 6px; background: rgba(255,255,255,0.95);
    border-radius: 12px; padding: 7px 9px; display: flex; flex-direction: column; gap: 4px;

  .legend div { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sw { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }

  .summary { display: flex; gap: 12px; align-items: center; }
  .summary img { width: 72px; height: 72px; flex-shrink: 0; border-radius: 50%; background: #fff; border: 2px solid var(--card-edge); }
  .summary h2 { font-size: 20px; line-height: 1.2; }

  .tag { display: inline-block; border-radius: 6px; padding: 1px 7px; font-weight: 700; font-size: 13px; }

  const RULES = {

  }
  function inkOn(colour) { return colour === C.yellow ? C.navy : "#FFFFFF"; }
  function softOf(colour) { return colour === C.red ? "#FBE7E7" : colour === C.yellow ? "#FFF4D6" : "#E3F6EC"; }

  // While new forecasts are held back (a source is late), the last forecast stays on screen.
  // A target time it was made for that has already passed is greyed out, not shown as a forecast.
  // Only in live mode: the demo snapshot is old on purpose.
  function isPassed(row) {
    return dataMode === MODE_LIVE && !!row && Date.parse(row.forecast_time) <= Date.now();
  }

  // Names of the upstream sources that are late (status not ok), for the notice.
  function lateSources() {
    if (!sources) return [];
    const out = [];
    const weather = Object.keys(sources).filter(k => k.startsWith("weather_") && sources[k].status !== "ok");
    if (sources.pm25 && sources.pm25.status !== "ok") out.push("PM2.5 (" + Math.round(sources.pm25.age_hours || 0) + " hours old)");
    if (weather.length) out.push("weather at " + weather.map(k => k.charAt(8).toUpperCase() + k.slice(9)).join(", "));
    if (sources.fires && sources.fires.status === "alert") out.push("satellite fire data");
    return out;
  }

  // Values for the chosen tab: { region: { v, time } }
  function valuesFor(t) {
    const out = {};
    for (const r of [...REGIONS, "national"]) {
      if (t === "now") {
        out[r] = context && context.now ? { v: context.now[r], time: context.as_of_time } : { v: null };
      } else {
        const row = forecast.find(x => x.region === r && x.horizon_hours === Number(t));
        out[r] = row ? { v: row.forecast_pm25, time: row.forecast_time, passed: isPassed(row) } : { v: null };
      }
    }
    return out;
  }

  // ---------------------------------------------------------------------------
  // Loading
  // ---------------------------------------------------------------------------
  async function fetchJSON(path) {
    const res = await fetch(path);
    if (!res.ok) {
      let detail = "HTTP " + res.status;
      try { const body = await res.json(); if (body && body.detail) detail = body.detail; } catch (e) {}
      throw new Error(detail);
    }
    return res.json();
  }

  async function loadLive() {
    const cfg = await fetchJSON("/config");
    if (typeof cfg.elevated_threshold_ug_m3 === "number") threshold = cfg.elevated_threshold_ug_m3;
    forecast = await fetchJSON("/forecast/hourly");
    const asOf = forecast.map(r => Date.parse(r.as_of_time)).filter(Number.isFinite);
    forecastAgeHours = asOf.length ? (Date.now() - Math.max(...asOf)) / 3600000 : null;
    fireCarriedHours = Math.max(0, ...forecast.map(r => Number(r.fire_carried_hours) || 0));
    try { sources = (await fetchJSON("/health/sources")).sources; } catch (e) { sources = null; }
    // Latest readings and accuracy are extra: the forecast still shows if they are missing.
    try { context = await fetchJSON("/context"); } catch (e) { context = null; }
  }

  function loadDemo() {
    threshold = MOCK_CONFIG.elevated_threshold_ug_m3;
    forecast = MOCK_FORECAST;
    context = MOCK_CONTEXT;
    forecastAgeHours = null;
    fireCarriedHours = 0;
    sources = null;
  }

  async function setMode(m, why) {
    if (m === "demo") {
      dataMode = MODE_DEMO; demoReason = why || "chosen";
      loadDemo();
    } else {
      dataMode = MODE_LIVE;
      try {
        await loadLive();
        await fetch("/health");
      } catch (e) {
        dataMode = MODE_DEMO; demoReason = "offline";
        loadDemo();
      }
    }
    render();
  }

  // ---------------------------------------------------------------------------
  // Drawing
  // ---------------------------------------------------------------------------
  const SVGNS = "http://www.w3.org/2000/svg";
  function el(name, attrs, text) {
    const e = document.createElementNS(SVGNS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }

  function renderControls() {
    document.querySelectorAll("#tabs button").forEach(b => {
      b.classList.toggle("on", b.dataset.tab === tab);
      b.setAttribute("aria-selected", b.dataset.tab === tab);
    });
    document.querySelectorAll("#who .chip").forEach(b => b.classList.toggle("on", b.dataset.group === group));
    document.getElementById("modeLive").classList.toggle("on", dataMode === MODE_LIVE);
    document.getElementById("modeDemo").classList.toggle("on", dataMode === MODE_DEMO);
    const pill = document.getElementById("modePill");
    pill.classList.toggle("demo", dataMode === MODE_DEMO);
    document.getElementById("modePillText").textContent = dataMode === MODE_LIVE ? "Live" : "Demo";
  }

  function renderBanner() {
    const b = document.getElementById("banner");
    let msg = "";
    if (dataMode === MODE_DEMO) {
      const when = fmtDate(MOCK_CONTEXT.as_of_time);
      msg = "Demo: saved data from " + when + ".";
    } else if ((forecastAgeHours != null && forecastAgeHours > STALE_HOURS) || fireCarriedHours > 0) {
      const parts = [];
      if (forecastAgeHours != null && forecastAgeHours > STALE_HOURS) {
        const late = lateSources();
        const passed = forecast.filter(r => r.region === "national" && isPassed(r)).length;
        parts.push("These forecasts were made from data " + Math.round(forecastAgeHours) + " hours old. "
          + "No new forecast until fresh data arrives" + (late.length ? " (waiting for " + late.join("; ") + ")" : "")
          + ", so treat them with care." + (passed ? " " + passed + " of 3 target times have passed and are greyed out." : ""));
      }
      if (fireCarriedHours > 0) {
        parts.push("Satellite fire data is " + Math.round(fireCarriedHours)
          + " hours late, so this forecast uses the last fire counts received.");
      }
      msg = parts.join(" ");
    } else if (tab === "now" && !context) {
      msg = "Latest readings aren't available right now. Try a forecast tab.";
    }
    b.textContent = msg;
  }

  function renderMap(vals) {
    const title = tab === "now" ? "Singapore now"
      : "Singapore " + (tab === "24" ? "tomorrow" : "in " + tab + " hrs");
    const when = tab === "now"
      ? (context && context.as_of_time ? "Latest reading, " + fmtWhen(context.as_of_time, false) : "")
      : vals.national.passed ? "Was for " + fmtWhen(vals.national.time, true) + ", now passed"
      : (vals.national.time ? "Around " + fmtWhen(vals.national.time, true) : "");
    document.getElementById("mapTitle").textContent = title;
    document.getElementById("mapWhen").innerHTML = when + '<span class="unit"><span class="sep">' + (when ? " · " : "") + '</span>PM2.5 µg/m³</span>';

    const g = document.getElementById("regions"), lab = document.getElementById("labels");
    g.replaceChildren(); lab.replaceChildren();
    const parts = [];
    for (const r of REGIONS) {
      const a = vals[r].passed ? null : advice(vals[r].v);
      const fill = a ? a.colour : "#AEBBC7";
      const p = el("path", { d: REGION_PATHS[r], fill, stroke: "#FFFFFF", "stroke-width": 2.5, "stroke-linejoin": "round", class: "region", tabindex: 0, role: "button", "aria-label": NAME[r] + ": " + fmtPm(vals[r].v) });
      p.addEventListener("click", () => setHome(r));
      p.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setHome(r); } });
      g.appendChild(p);
      parts.push(NAME[r] + " " + fmtPm(vals[r].v) + (a ? " " + a.short : ""));
    }
    // Outline your region on top so the white borders don't hide it.
    g.appendChild(el("path", { d: REGION_PATHS[home], fill: "none", stroke: C.navy, "stroke-width": 2.5, "stroke-linejoin": "round", "pointer-events": "none" }));

    for (const r of REGIONS) {
      const [x, y] = LABEL_POS[r];
      const a = vals[r].passed ? null : advice(vals[r].v);
      const ink = a ? inkOn(a.colour) : C.navy;
      lab.appendChild(el("text", { x, y, "text-anchor": "middle", "font-size": 11, "font-weight": 700, fill: ink, "pointer-events": "none" }, NAME[r]));
      lab.appendChild(el("rect", { x: x - 18, y: y + 5, width: 36, height: 19, rx: 9.5, fill: "#FFFFFF", stroke: C.navy, "stroke-opacity": r === home ? 1 : 0.15, "stroke-width": r === home ? 1.5 : 1, "pointer-events": "none" }));
      lab.appendChild(el("text", { x, y: y + 18.6, "text-anchor": "middle", "font-size": 12, "font-weight": 800, fill: C.navy, "pointer-events": "none",
        "text-decoration": vals[r].passed ? "line-through" : "none", opacity: vals[r].passed ? 0.5 : 1 }, fmtPm(vals[r].v)));
      if (r === home) {
        // "You" tag beside your region's badge
        lab.appendChild(el("rect", { x: x + 20, y: y + 6.5, width: 26, height: 16, rx: 8, fill: C.navy, "pointer-events": "none" }));
        lab.appendChild(el("text", { x: x + 33, y: y + 17.8, "text-anchor": "middle", "font-size": 9.5, "font-weight": 800, fill: "#FFFFFF", "pointer-events": "none" }, "You"));
      }
    }
    document.getElementById("map").setAttribute("aria-label", title + (when ? ", " + when : "") + ". " + parts.join(", "));

    const rs = rules();
    const lo = [0, rs[0].max + 1, rs[1].max + 1];
    document.getElementById("legend").innerHTML =
      `<div><span class="sw" style="background:${rs[2].colour}"></span><span><b>${lo[2]}+</b> ${rs[2].short}</span></div>` +
      `<div><span class="sw" style="background:${rs[1].colour}"></span><span><b>${lo[1]} to ${rs[1].max}</b> ${rs[1].short}</span></div>` +
      `<div><span class="sw" style="background:${rs[0].colour}"></span><span><b>0 to ${rs[0].max}</b> ${rs[0].short}</span></div>`;
  }

  function renderSummary(vals) {
    const keys = REGIONS.filter(r => !vals[r].passed).map(r => advice(vals[r].v)).filter(Boolean).map(a => a.key);
    const mascot = document.getElementById("mascot");
    const title = document.getElementById("sumTitle"), line = document.getElementById("sumLine");
    if (REGIONS.every(r => vals[r].passed)) {
      title.textContent = "Waiting for a new forecast";
      line.textContent = "The time this forecast was for has passed. A new one comes as soon as fresh data arrives.";
      mascot.src = MASCOT_NORMAL;
      return;
    }
    if (!keys.length) {
      title.textContent = "No numbers for this time yet";
      line.textContent = "Try another tab.";
      mascot.src = MASCOT_NORMAL;
      return;
    }
    const all = k => keys.every(x => x === k), any = k => keys.includes(k);
    let t;
    if (all("in")) t = "Stay indoors";
    else if (any("in")) t = "Depends where you are";
    else if (all("mask")) t = "Mask on if you head out";
    else if (any("mask")) t = "Outdoors, with a mask in places";
    else t = "Outdoors! Enjoy the sun";
    title.textContent = t;
    mascot.src = any("in") ? MASCOT_HIGH : any("mask") ? MASCOT_AMBER : MASCOT_NORMAL;

    const a = advice(vals[home].v);
    const who = group === "sensitive" ? " For children, the elderly and asthmatic patients, " : " ";
    if (a) {
      line.innerHTML = `<b>${NAME[home]}</b> (your area): <span class="tag" style="background:${softOf(a.colour)};color:${a.colour === C.yellow ? "#6B4E00" : a.colour}">${fmtPm(vals[home].v)}</span>.${who}${who === " " ? a.long.charAt(0).toUpperCase() + a.long.slice(1) : a.long}.`;
    } else {
      line.textContent = "No number for " + NAME[home] + " at this time.";
    }
  }

  function renderBest() {
    document.getElementById("bestFor").textContent = "for " + NAME[home];
    const slots = [{ tab: "now", label: "Now" }, { tab: "6", label: "In 6 hrs" }, { tab: "12", label: "In 12 hrs" }, { tab: "24", label: "Tomorrow" }]
      .map(s => {
        const x = valuesFor(s.tab)[home];
        return Object.assign(s, x, { a: x.passed ? null : advice(x.v), clock: s.tab === "now" ? "" : fmtWhen(x.time, s.tab === "24") });
      });
    const known = slots.filter(s => s.a);
    let best = known.find(s => s.a.key === "out");
    if (!best && known.length) best = known.reduce((m, s) => (s.v < m.v ? s : m));
    document.getElementById("slots").innerHTML = slots.map(s => `
      <div class="slot${s === best ? " best" : ""}${s.passed ? " passed" : ""}"${s.passed ? ' title="Target time has passed; waiting for a new forecast"' : ""}>
        <div class="when">${s.label}${s.clock ? "<br>" + s.clock : "<br>&nbsp;"}</div>
        <div class="val">${fmtPm(s.v)}</div>
        <div class="bar" style="background:${s.a ? s.a.colour : "#DCE6EF"}"></div>
        <div class="what">${s.passed ? "Passed" : s.a ? s.a.short : "No data"}</div>
      </div>`).join("");
    const line = document.getElementById("bestLine");
    if (!best) { line.textContent = "Not enough numbers to pick a time."; return; }
    const at = best.tab === "now" ? "right now" : "around " + best.clock;
    if (best.a.key === "out") {
      line.innerHTML = best.tab === "now" ? "<b>Go now.</b> The air is good in " + NAME[home] + " right now."
        : `<b>Best window: ${at}.</b> The air should be good enough to go out.`;
    } else {
      line.innerHTML = `<b>No clear window.</b> The cleanest air is ${at}, when you should ${best.a.long}.`;
    }
  }

  function renderSure() {
    const ring = document.getElementById("ring"), text = document.getElementById("sureText");
    ring.replaceChildren();
    const acc = (context && context.accuracy && context.accuracy.horizons) ? context.accuracy : MOCK_CONTEXT.accuracy;
    const drawRing = (share, label) => {
      ring.appendChild(el("circle", { cx: 36, cy: 36, r: 30, fill: "none", stroke: "#D7EEE6", "stroke-width": 8 }));
      if (share != null) {
        const len = 2 * Math.PI * 30;
        ring.appendChild(el("circle", { cx: 36, cy: 36, r: 30, fill: "none", stroke: "#0F7E93", "stroke-width": 8, "stroke-linecap": "round",
          "stroke-dasharray": `${len * share} ${len}`, transform: "rotate(-90 36 36)" }));
      }
      ring.appendChild(el("text", { x: 36, y: 41, "text-anchor": "middle", "font-size": 16, "font-weight": 800, fill: C.navy }, label));
    };
    if (tab === "now") {
      drawRing(1, "Real");
      text.innerHTML = "<p><b>Measured readings</b> from NEA's stations, not a forecast.</p>";
    } else {
      const h = acc.horizons[tab] || {};
      const caught = h.caught_share != null ? Math.round(h.caught_share * 10) : null;
      const right = h.right_when_warned != null ? Math.round(h.right_when_warned * 10) : null;
      const name = tab === "24" ? "tomorrow's" : "the " + tab + "-hour";
      const period = acc.test_period ? ` (${fmtMonth(acc.test_period[0])} to ${fmtMonth(acc.test_period[1])})` : "";
      drawRing(h.caught_share, caught != null ? caught + "/10" : "–");
      text.innerHTML = `<p>In testing${period}, ${name} forecast <b>caught ${caught} in 10 unhealthy hours</b>`
        + (right != null ? ` and was right ${right} in 10 times it warned.` : ".") + `</p>`;
    }
    const m = context && context.monitoring;
    const check = document.getElementById("check");
    check.hidden = dataMode === MODE_DEMO;   // the demo snapshot has no health check to report
    let colour = "#8FA3B5", msg = "Model check: not run yet";
    if (m && m.action) {
      if (m.action === "none") { colour = C.green; msg = "Model check: all good"; }
      else if (m.action === "investigate") { colour = C.yellow; msg = "Model check: under review"; }
      else if (m.action === "retrain") { colour = "#E07B24"; msg = "Model check: retraining"; }
      else { colour = C.red; msg = "Model check: data issue"; }
      if (m.generated_at) msg += " (" + fmtDate(m.generated_at) + ")";
    }
    check.innerHTML = `<span class="status-dot" style="background:${colour}"></span><span>${msg}</span>`;
  }
  function fmtMonth(isoDate) {
    const d = new Date(isoDate + "T00:00:00+08:00");
    return d.toLocaleString("en-SG", { month: "short", year: "numeric", timeZone: "Asia/Singapore" });
  }

  function render() {
    renderControls();
    renderBanner();
    const vals = valuesFor(tab);
    renderMap(vals);
    renderSummary(vals);
    renderBest();
    renderSure();
  }

  // ---------------------------------------------------------------------------
  // Interaction
  // ---------------------------------------------------------------------------
  function setHome(r) { home = r; store.set("hh-region", r); render(); }
  document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; render(); }));
  document.querySelectorAll("#who .chip").forEach(b => b.addEventListener("click", () => { group = b.dataset.group; store.set("hh-group", group); render(); }));
  document.getElementById("modeLive").addEventListener("click", () => setMode("live"));
  document.getElementById("modeDemo").addEventListener("click", () => setMode("demo", "chosen"));
  document.getElementById("refreshBtn").addEventListener("click", () => setMode(dataMode === MODE_DEMO && demoReason === "chosen" ? "demo" : "live", "chosen"));

  function nearestRegion(lat, lon) {
    let best = null, bestD = Infinity;
    for (const r of REGIONS) {
      const [a, b] = REGION_CENTRE[r];
      const d = Math.hypot(lat - a, (lon - b) * Math.cos(lat * Math.PI / 180));
      if (d < bestD) { bestD = d; best = r; }
    }
    return { region: best, km: bestD * 111 };
  }
  document.getElementById("locBtn").addEventListener("click", () => {
    const note = document.getElementById("locNote");
    if (!navigator.geolocation) { note.textContent = "Your browser can't share location. Tap your region on the map instead."; return; }
    note.textContent = "Finding you…";
    navigator.geolocation.getCurrentPosition(pos => {
      const { region, km } = nearestRegion(pos.coords.latitude, pos.coords.longitude);
      if (km > 30) { note.textContent = "You seem to be outside Singapore, so tap the region you're heading to."; return; }
      note.textContent = "You're in the " + NAME[region] + " region.";
      setHome(region);
    }, () => {
      note.textContent = "We couldn't get your location. Tap your region on the map instead.";
    }, { timeout: 10000, maximumAge: 600000 });
  });

  setMode("live");
  setInterval(() => { if (dataMode === MODE_LIVE) setMode("live"); }, 60000);
</script>
</body>
</html>

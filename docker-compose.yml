# HazeCast SG -- local proof-of-concept stack.
#   docker compose up --build
#
# Brings up: MLflow tracking server, Airflow (webserver+scheduler, dev-mode
# SequentialExecutor), and the FastAPI scoring endpoint. Airflow uses the
# official image with _PIP_ADDITIONAL_REQUIREMENTS for our extra deps --
# fine for a class project / local dev, but Astronomer's own docs say not
# to do this in production (rebuild-on-every-start cost); a custom image
# per docker/pipeline.Dockerfile's pattern would replace it there.
#
# First run: `docker compose run --rm airflow-webserver airflow db init`
# then create a user, or set AIRFLOW__CORE__SIMPLE_AUTH_MANAGER... see
# README.md "Running it" for exact commands, since these vary by Airflow
# version.

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    PYTHONPATH: /opt/airflow/src
    FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
    DATA_GOV_SG_API_KEY: ${DATA_GOV_SG_API_KEY:-}
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-pandas xgboost mlflow scikit-learn pyarrow}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - airflow_db:/opt/airflow

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - mlflow

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - mlflow

  api:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    command: uvicorn serving.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - mlflow

  # Same pattern as the Assignment 1 environment: JupyterLab in-browser,
  # no auth token (convenience for local dev only -- do not expose this
  # port beyond localhost). Runs the pipeline.Dockerfile image so every
  # hazecast.* module is importable straight from a notebook cell; the
  # repo root is mounted read/write so edits and notebook runs persist.
  # --allow-root: pipeline.Dockerfile never creates a non-root user (its
  # only job is running batch jobs / the API, where this doesn't matter),
  # so the container's default user is root -- JupyterLab refuses to start
  # as root without this flag (confirmed: it built fine but exited 1 on
  # first real run without it).
  jupyter:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --NotebookApp.token='' --NotebookApp.password=''
      --notebook-dir=/app
    ports:
      - "8888:8888"
    volumes:
      - .:/app

volumes:
  airflow_db:
  mlflow_data:

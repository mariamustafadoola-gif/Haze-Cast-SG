# HazeCast SG -- end-to-end stack: Airflow (orchestration) + MLflow (tracking)
# + FastAPI (forecast + monitoring API) + JupyterLab (exploration).
#
#   cp .env.example .env        # add FIRMS_MAP_KEY (free) -- optional but fire features go stale without it
#   docker compose up -d --build
#
#   Airflow   http://localhost:8080   (admin / admin -- local dev only)
#   MLflow    http://localhost:5000
#   API       http://localhost:8000/docs   (/forecast/hourly, /monitoring/dashboard)
#   Jupyter   http://localhost:8888/lab
#
# First run: in Airflow, trigger `hazecast_backfill` once (downloads whatever
# history data/raw/ is missing, rebuilds the layers and triggers training).
# The hourly / monitoring / retrain DAGs then run on their schedules.
# See README.md "End-to-end pipeline".

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  image: hazecast-airflow:latest
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Singapore
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Singapore
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow/src
    GIT_PYTHON_REFRESH: quiet
    OMP_WAIT_POLICY: PASSIVE   # idle OpenMP threads sleep instead of spinning (XGBoost/LightGBM)
    MLFLOW_TRACKING_URI: http://mlflow:5000
    FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
    DATA_GOV_SG_API_KEY: ${DATA_GOV_SG_API_KEY:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./reports:/opt/airflow/reports
    - ./tests:/opt/airflow/tests
    - airflow_logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Haze --lastname Cast \
          --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_started
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    image: hazecast-pipeline:latest
    command: uvicorn serving.app:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped

  # JupyterLab in-browser, no auth token (local dev only -- do not expose this
  # port beyond localhost). --allow-root: the image runs as root.
  jupyter:
    image: hazecast-pipeline:latest
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --ServerApp.token='' --ServerApp.password='' --notebook-dir=/app
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      DATA_GOV_SG_API_KEY: ${DATA_GOV_SG_API_KEY:-}
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - .:/app
    profiles: ["dev"]

volumes:
  postgres_data:
  mlflow_data:
  airflow_logs:
